# EDUCATIONAL SECURITY TRAINING ENVIRONMENT
# Nginx Rate Limiting Configuration
# Purpose: DDoS protection and resource abuse prevention

# =============================================================================
# Rate Limit Zones
# =============================================================================
# These zones are defined in nginx.conf and referenced here

# General rate limit: 10 requests/second per IP
# Zone: general
# Usage: limit_req zone=general burst=20 nodelay;

# Login rate limit: 1 request/minute per IP
# Zone: login
# Usage: limit_req zone=login burst=3 nodelay;

# Registration rate limit: 1 request/hour per IP
# Zone: register
# Usage: limit_req zone=register burst=1 nodelay;

# API rate limit: 100 requests/minute per IP
# Zone: api
# Usage: limit_req zone=api burst=50 nodelay;

# Connection limit: 10 concurrent connections per IP
# Zone: addr
# Usage: limit_conn addr 10;

# =============================================================================
# Rate Limit Configuration Notes
# =============================================================================

# Burst: Number of requests that can exceed rate limit before rejecting
# - Allows for short bursts while maintaining overall rate
# - burst=20 with rate=10r/s means 20 extra requests allowed in burst

# nodelay: Process burst requests immediately without delaying
# - Without nodelay, requests would be delayed to smooth out rate
# - With nodelay, requests are processed immediately until limit

# =============================================================================
# Custom Rate Limit Rules
# =============================================================================

# Map for dynamic rate limiting based on request characteristics
map $request_uri $limit_key {
    default                     $binary_remote_addr;
    ~^/auth/                    $binary_remote_addr;
    ~^/admin/                   $binary_remote_addr;
}

# Whitelist for certain IPs (e.g., monitoring, health checks)
geo $limit_whitelist {
    default         1;
    127.0.0.1       0;  # Localhost
    172.20.0.0/24   0;  # Docker network
}

# =============================================================================
# Rate Limit Bypass (for whitelisted IPs)
# =============================================================================

# Example: Bypass rate limits for whitelisted IPs
# if ($limit_whitelist = 0) {
#     set $limit_key "";
# }

# =============================================================================
# Error Handling
# =============================================================================

# Custom error page for rate limit exceeded (429)
# error_page 429 /rate_limit.html;
# location = /rate_limit.html {
#     internal;
#     return 429 "Rate limit exceeded. Please try again later.\n";
#     add_header Content-Type text/plain;
#     add_header Retry-After 60;
# }

# =============================================================================
# Monitoring and Logging
# =============================================================================

# Log format for rate limit events
log_format rate_limit '$remote_addr - [$time_local] '
                      '"$request" $status '
                      'rate_limit_key=$limit_key '
                      'zone=$limit_req_zone '
                      'delay=$limit_req_delay';

# Enable rate limit logging in specific locations if needed
# access_log /var/log/nginx/rate_limit.log rate_limit;
