# EDUCATIONAL SECURITY TRAINING ENVIRONMENT
# Simplified Nginx Configuration

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide version
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Rate limiting
    # General: 50 req/s allows normal browsing with CSS/JS/images
    # Login: 5 req/min allows multiple attempts while preventing brute force
    # Register: 1 req/min prevents spam registrations
    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=register:10m rate=1r/m;

    limit_req_status 429;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json;

    server {
        listen 80 default_server;
        server_name _;

        # Simple proxy to Flask app
        location / {
            proxy_pass http://app:5000;
            proxy_http_version 1.1;

            # Essential headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cookie handling
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;

            # No buffering - fixes chunked encoding issues
            proxy_buffering off;
            proxy_request_buffering off;

            # Rate limiting - allow burst for page loads with multiple assets
            limit_req zone=general burst=100 nodelay;
        }
    }
}
