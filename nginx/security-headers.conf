# EDUCATIONAL SECURITY TRAINING ENVIRONMENT
# Nginx Security Headers Configuration
# Purpose: Implement defense-in-depth security headers

# =============================================================================
# Content Security Policy (CSP)
# =============================================================================
# Strict CSP to prevent XSS attacks
# Note: No inline scripts, no external scripts for Tor compatibility

add_header Content-Security-Policy "
    default-src 'self';
    script-src 'none';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'self';
    media-src 'none';
    object-src 'none';
    frame-src 'none';
    worker-src 'none';
    form-action 'self';
    frame-ancestors 'none';
    base-uri 'self';
    manifest-src 'none';
" always;

# =============================================================================
# XSS Protection
# =============================================================================

# X-XSS-Protection: Enable browser XSS filter
add_header X-XSS-Protection "1; mode=block" always;

# =============================================================================
# Clickjacking Protection
# =============================================================================

# X-Frame-Options: Prevent clickjacking attacks
add_header X-Frame-Options "DENY" always;

# =============================================================================
# MIME Type Sniffing Protection
# =============================================================================

# X-Content-Type-Options: Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# =============================================================================
# Referrer Policy
# =============================================================================

# Referrer-Policy: Don't leak referrer information
add_header Referrer-Policy "no-referrer" always;

# =============================================================================
# Permissions Policy (formerly Feature Policy)
# =============================================================================

# Permissions-Policy: Disable dangerous browser features
add_header Permissions-Policy "
    geolocation=(),
    microphone=(),
    camera=(),
    payment=(),
    usb=(),
    magnetometer=(),
    gyroscope=(),
    accelerometer=(),
    ambient-light-sensor=(),
    autoplay=(),
    encrypted-media=(),
    fullscreen=(self),
    picture-in-picture=(),
    screen-wake-lock=(),
    web-share=()
" always;

# =============================================================================
# HSTS (HTTP Strict Transport Security)
# =============================================================================

# Force HTTPS for 1 year (only enable when using HTTPS)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# =============================================================================
# Cross-Origin Policies
# =============================================================================

# Cross-Origin-Embedder-Policy: Require corp for cross-origin resources
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# Cross-Origin-Opener-Policy: Isolate browsing context
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Cross-Origin-Resource-Policy: Prevent cross-origin resource access
add_header Cross-Origin-Resource-Policy "same-origin" always;

# =============================================================================
# Cache Control for Security
# =============================================================================

# Prevent caching of sensitive pages
add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
add_header Pragma "no-cache" always;
add_header Expires "0" always;

# =============================================================================
# Additional Security Headers
# =============================================================================

# X-Permitted-Cross-Domain-Policies: Restrict Flash/PDF cross-domain
add_header X-Permitted-Cross-Domain-Policies "none" always;

# X-Download-Options: Prevent IE from executing downloads in site context
add_header X-Download-Options "noopen" always;

# =============================================================================
# Custom Security Headers (for monitoring)
# =============================================================================

# X-Security-Environment: Indicate this is a training environment
add_header X-Security-Environment "Educational-Training-Only" always;

# X-Content-Security-Policy-Report-Only: CSP reporting (optional)
# add_header Content-Security-Policy-Report-Only "default-src 'self'; report-uri /csp-report" always;
