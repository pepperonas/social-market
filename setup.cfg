# mutmut (improvement plan 2026-11, C6): nightly, non-blocking mutation run.
# mutmut 3 copies the code into ./mutants and runs the tests there, so every
# directory the app imports or the tests read has to be copied along.
[mutmut]
source_paths =
    app/services/
    app/models/order.py
pytest_add_cli_args_test_selection =
    tests/
also_copy =
    app/
    deploy/
    docs/
    examples/
    migrations/
    monitoring/
    nginx/
    postgres/
    scripts/
    tor/
    celery_worker.py
    docker-compose.yml
    pytest.ini
    .flake8
    .github/
    .gitignore
    CLAUDE.md
    CONTRIBUTING.md
    DEPLOY.md
    LICENSE
    LOGIN_CREDENTIALS.md
    README.md
    SECURITY.md
    SETUP.md
do_not_mutate =
    app/services/__init__.py
