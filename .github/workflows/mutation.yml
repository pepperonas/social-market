name: Mutation testing

# Improvement plan 2026-11, C6: mutation probes used to be run by hand for each
# change. This runs mutmut over app/services/ and app/models/order.py every
# night. It never blocks anything: it reports how many mutants the suite
# kills, and the list of survivors is the to-do list for new tests.
# Configuration: [mutmut] in setup.cfg.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: mutmut (services, order model)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 gnupg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt mutmut==3.8.1

      - name: Run mutmut
        env:
          SECRET_KEY: test-secret-key-ci-only
          PASSWORD_PEPPER: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TESTING: 'true'
        # A surviving mutant is a finding, not a failure of this job.
        run: mutmut run || true

      - name: Report
        if: always()
        run: |
          mutmut export-cicd-stats || true
          mutmut results > mutmut-survivors.txt 2>/dev/null || true
          {
            echo '## Mutation testing'
            echo
            echo '```json'
            cat mutants/mutmut-cicd-stats.json 2>/dev/null || echo '{"error": "no stats"}'
            echo '```'
            echo
            echo "Survivors: $(grep -c ': survived' mutmut-survivors.txt || true)"
            echo 'Inspect one with `mutmut show <name>` after downloading the artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-results
          path: |
            mutmut-survivors.txt
            mutants/mutmut-cicd-stats.json
