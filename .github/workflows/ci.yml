name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Run flake8
        # Settings live in .flake8 so local runs and CI cannot drift apart.
        run: flake8 app/ tests/

      - name: Run bandit (security linter)
        run: |
          bandit -r app/ -ll --skip B101 -f json -o bandit-report.json || true
          bandit -r app/ -ll --skip B101

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major version as the live server.
        image: postgres:16
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 gnupg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://marketplace:testpassword@localhost:5432/marketplace_test
          REDIS_URL: redis://localhost:6379/0
          RATELIMIT_STORAGE_URL: redis://localhost:6379/1
          SECRET_KEY: test-secret-key-ci-only
          PASSWORD_PEPPER: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WTF_CSRF_ENABLED: 'false'
          RATELIMIT_ENABLED: 'false'
          TESTING: 'true'
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Run tests against PostgreSQL
        # The step above runs on SQLite (fast, and the coverage numbers). This
        # one runs the same suite against the PostgreSQL service with the
        # schema built from postgres/*.sql + db.create_all() + migrations/, plus
        # the PostgreSQL-only modules (pgcrypto, session time zone, races
        # between two connections). Improvement plan 2026-11, C1/C2.
        env:
          TEST_DATABASE_URL: postgresql://marketplace:testpassword@localhost:5432/marketplace_test
          REQUIRE_POSTGRES: '1'
          SECRET_KEY: test-secret-key-ci-only
          PASSWORD_PEPPER: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WTF_CSRF_ENABLED: 'false'
          RATELIMIT_ENABLED: 'false'
          TESTING: 'true'
        run: pytest tests/ -q --tb=short -p no:cacheprovider

      - name: Enforce route coverage target
        run: python -m coverage report --include='app/routes/*' --precision=2 --fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      # Full history: this repository once carried a live password pepper for 19
      # commits inside a documentation file. Scanning only the tip would have
      # missed it. See docs/PASSWORD_SECURITY.md.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        # No `|| true`: a dependency advisory must fail the job, otherwise the
        # scan reports nothing and nobody notices.
        run: pip-audit -r app/requirements.txt --desc
